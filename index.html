<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tenho uma pergunta...</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA 1 -->
    <div class="card" id="pergunta">

        <div class="emoji">👀</div>

        <h1>Tenho uma pergunta pra você...</h1>

        <p>Prometo que é uma pergunta importante kkkkk</p>

        <h2>Quer sair comigo?</h2>

        <div class="botoes">

            <button id="sim">
                Sim 😏
            </button>

            <button id="nao">
                Não 🙄
            </button>

        </div>

        <span class="dica">
            Escolha com sabedoria...
        </span>

    </div>


    <!-- TELA 2 -->
    <div class="card escondido" id="escolha">

        <div class="emoji">🥰</div>

        <h1>Eu sabia!</h1>

        <p>Agora que você aceitou...</p>

        <h2>Escolhe nosso rolê 👀</h2>

        <div class="opcoes">

            <button onclick="escolher('cinema')">
                🎬
                <strong>Cinema</strong>
                <small>Filme + pipoca 🍿</small>
            </button>

            <button onclick="escolher('surpresa')">
                🎁
                <strong>Surpresa</strong>
                <small>Você só precisa confiar</small>
            </button>

        </div>

    </div>


    <!-- TELA 3 -->
    <div class="card escondido" id="resultado">

        <div class="emoji" id="emojiResultado"></div>

        <h1 id="tituloResultado"></h1>

        <p id="textoResultado"></p>

        <div class="coracao">❤️</div>

        <p class="aviso-escolha">
            Agora só falta uma coisa... me contar sua escolha 👀
        </p>

        <button id="enviarEscolha">
            Mandar minha escolha 💌
        </button>

    </div>


    <!-- MÚSICA -->
    <audio id="musica" loop>
        <source src="musica/musica.mp3" type="audio/mpeg">
    </audio>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
